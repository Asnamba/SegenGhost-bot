services:
  - type: web
    name: segenghost-bot
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: segenghost-db
          property: connectionString
      - key: ADMIN_API_TOKEN
        sync: false
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: DISCORD_WEBHOOK_URGENT
        value: ""
      - key: DISCORD_WEBHOOK_DIGEST
        value: ""
      - key: DISCORD_TOKEN
        value: ""
      - key: DISCORD_CHANNEL_ID
        value: ""
      - key: DISCORD_CHANNEL_URGENT_ID
        value: ""
      - key: DISCORD_CHANNEL_DIGEST_ID
        value: ""
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GROQ_API_KEY
        value: ""
      - key: MISTRAL_API_KEY
        value: ""
      - key: AI_PROVIDER_PRIORITY
        value: gemini,groq,mistral,anthropic
      - key: AI_MODEL
        value: claude-sonnet-4-6
      - key: AI_MAX_RETRIES
        value: "2"
      - key: AI_TIMEOUT_SECONDS
        value: "30"
      - key: AI_MAX_RETRY_CYCLES
        value: "3"
      - key: CVSS_URGENT_THRESHOLD
        value: "8.5"
      - key: COLLECT_INTERVAL_MINUTES
        value: "60"
      - key: HTTP_TIMEOUT_SECONDS
        value: "15"
      - key: RSS_FETCH_MAX_RETRIES
        value: "2"
      - key: REJECTED_RETENTION_DAYS
        value: "30"
      - key: PUBLISHED_RETENTION_DAYS
        value: "90"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: segenghost-db
    plan: free
    databaseName: segenghost
    user: segenghost
